<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Clue #5</title>
        <link rel="stylesheet" href="custom.css">
    </head>
    
    <body>
        <header class="hero">
            <div class="hero-content">
                <span class="arcade-tag">Unsolved</span>
                <h1>Clue #5</h1>
                <p>GitHub Workflow</p>
                <button class="arcade-tag status-toggle" type="button" aria-pressed="false"
                data-clue-id="5">
                    Unsolved
                </button>
            </div>
        </header>

        <main class="container" style="max-width: 800px; padding: 2rem 1.5rem;">
            <div class="panel" style="margin-bottom: 2rem;">
                <h2>Mission Objective</h2>
                <p>
                    Find the correct order to use GitHub.
                </p>
            </div>

            <!-- puzzle portion -->
            <div class="flip-card-container">
                <input type="checkbox" id="puzzle-flip-toggle" class="flip-checkbox">

                <div class="flip-card">
                    <!-- FRONT SIDE -->
                    <div class="flip-card-face flip-front">
                        <div>
                            <h3>Workflow Jigsaw Puzzle</h3>
                            <p style="color: var(--text-muted); margin-top: 0.5rem;">
                                [ Jigsaw puzzle interface will go here ]
                            </p>
                        </div>
                        <div style="text-align: right; position: relative; z-index: 5;">
                            <label for="puzzle-flip-toggle" class="btn-flip">Flip Puzzle Over &rarr;</label>
                        </div>
                    </div>

                    <!-- BACK SIDE -->
                    <div class="flip-card-face flip-back">
                        <div>
                            <h3>Grid Clue</h3>
                            <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.9rem;">
                                The reverse side reveals a digit for the exit.
                            </p>
                        </div>

                        <div style="position: relative; z-index: 5;">
                            <label for="puzzle-flip-toggle" class="btn-flip">&larr; Flip Back to Puzzle</label>
                        </div>
                    </div>
                </div>
            </div>


        </main>
        <footer style="padding:40px; text-align: center;">
            <a class="btn-investigate" href="home.html" style="display: inline-block; width: auto; padding: 0.5rem 1.25rem;">Back to clue page</a>
        </footer>
        <script src="js/progress.js"></script>
    </body>

    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
</html>
